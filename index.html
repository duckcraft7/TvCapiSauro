<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Capi Sauro - Escolha seu clássico</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        .movie-card.focused {
            transform: scale(1.08);
            border: 4px solid #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            z-index: 10;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>Capivaras e Dinossauros🦖</h1>
        <p>Escolha seu Filme.</p>
    </header>

    <main>
        <section class="movie-section">
            <h2>Filmes</h2>
            <div class="movie-grid">
                
                <a class="movie-card" href="player_avatar.html" target="_blank">
                    <img src="https://i.ibb.co/mVFbyJXK/images-1.jpg" alt="Pôster do Filme Avatar">
                    <div class="movie-info">
                        <h3>Avatar</h3>
                        <p>2009</p>
                    </div>
                </a>

                <a class="movie-card" href="player_shrek.html" target="_blank">
                    <img src="https://i.ibb.co/5grHx4RB/images-1.webp" alt="Pôster do Filme Shrek 1">
                    <div class="movie-info">
                        <h3>Shrek 1</h3>
                        <p>2001</p>
                    </div>
                </a>

            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 TV Capi Sauro. Feito com ❤️ para os amantes de cinema.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const movieCards = document.querySelectorAll('.movie-card');
            if (movieCards.length === 0) return;

            let currentFocusIndex = 0;

            const setFocus = (index) => {
                movieCards[currentFocusIndex].classList.remove('focused');
                currentFocusIndex = index;
                movieCards[currentFocusIndex].classList.add('focused');
                movieCards[currentFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            document.addEventListener('keydown', (event) => {
                // Previne o comportamento padrão do navegador para as setas, que poderia ser rolar a página
                event.preventDefault();

                const grid = document.querySelector('.movie-grid');
                const gridStyle = window.getComputedStyle(grid);
                const gridColumnCount = gridStyle.getPropertyValue('grid-template-columns').split(' ').length;

                switch (event.key) {
                    case 'ArrowRight':
                        if (currentFocusIndex < movieCards.length - 1) setFocus(currentFocusIndex + 1);
                        break;
                    case 'ArrowLeft':
                        if (currentFocusIndex > 0) setFocus(currentFocusIndex - 1);
                        break;
                    case 'ArrowDown':
                        if (currentFocusIndex + gridColumnCount < movieCards.length) setFocus(currentFocusIndex + gridColumnCount);
                        break;
                    case 'ArrowUp':
                        if (currentFocusIndex - gridColumnCount >= 0) setFocus(currentFocusIndex - gridColumnCount);
                        break;
                    case 'Enter':
                        // ---- A CORREÇÃO DEFINITIVA ESTÁ AQUI ----
                        
                        // Pega o endereço (href) diretamente do card que está em foco
                        const targetUrl = movieCards[currentFocusIndex].getAttribute('href');
                        
                        // Damos a ordem direta e explícita para o navegador ir para esse endereço
                        if (targetUrl) {
                            window.location.href = targetUrl;
                        }
                        break;
                }
            });

            setFocus(0);
        });
    </script>
</body>
</html>
